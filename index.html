<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オンライン合否照会｜芝浦工業大学</title>
<style>
:root{--green:#0c420c;--scale:1}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#3e3e3e;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:calc(14px * var(--scale));line-height:1.5}
.header{background:var(--green);border-bottom:5px solid #ccc;color:#fff}
.header-inner{max-width:1000px;min-height:74px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding-right:21px}
.university{font-size:calc(24px * var(--scale));font-weight:400;white-space:nowrap}
.settings{display:grid;grid-template-columns:80px repeat(3,49px);gap:5px 6px;align-items:center;padding:8px 0 10px}
.settings-label{font-size:12px;font-weight:bold;white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.option{height:24px;border:1px solid #999;border-radius:3px;background:linear-gradient(#d3d3d3,#a8a8a8);color:white;padding:0;font-size:14px;font-weight:bold;line-height:22px}
.option[aria-pressed="true"]{background:linear-gradient(#1db5df,#0082d2);border-color:#008eb9}
button:focus-visible{outline:3px solid #00a9e8;outline-offset:3px}
main{max-width:1000px;margin:20px auto 0}
h1{margin:0;background:var(--green);border-radius:3px;color:white;font-size:calc(20px * var(--scale));font-weight:400;padding:9px 15px 10px;line-height:29px}
h1 span{display:block;border-left:5px solid #fff;padding-left:10px;line-height:21px;margin:5px 0}
h2{font-size:calc(18px * var(--scale));font-weight:400;margin:19px 0 20px;padding:0 0 6px;border-bottom:1px solid #ccc;line-height:25px}
h2 span{border-left:5px solid #000;padding-left:9px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.result{width:25%}col.course{width:52.5%}col.number{width:22.5%}
th,td{border:2px solid #ccc;font-weight:400}
th{background:#eee;text-align:left;padding:13px 14px;line-height:22px}
td{padding:16px 14px;line-height:29px}
.result-cell{background:#eee;text-align:center;font-size:calc(24px * var(--scale))}
.number-cell{text-align:center;font-size:calc(28px * var(--scale))}
.review{margin-top:20px;border:2px solid #ccc}
.review-label{display:block;background:#eee;border-bottom:2px solid #ccc;padding:10px 14px;font-weight:400}
.review-input{display:block;width:100%;min-height:230px;border:0;border-radius:0;background:#fff;color:inherit;font:inherit;line-height:1.9;padding:15px 14px;resize:vertical}
.review-input:focus-visible{outline:2px solid #008eb9;outline-offset:-2px}
.actions{text-align:center;margin-top:20px}
.back{position:relative;min-width:190px;height:36px;padding:0 27px;border:1px solid #c5c5c5;border-radius:3px;background:linear-gradient(#d0d0d0,#a7a7a7);color:#fff;font-size:14px;font-weight:bold}
.back::before{content:"";position:absolute;left:8px;top:13px;border-top:4px solid transparent;border-bottom:4px solid transparent;border-right:5px solid white}
.mypage{padding:20px;border:2px solid #ccc;margin-top:20px}
.mypage p{margin:0 0 18px}
[hidden]{display:none!important}
@media(max-width:1040px){.header-inner,main{margin-left:20px;margin-right:20px}}
@media(max-width:600px){.header-inner{align-items:flex-start;gap:14px;flex-direction:column;padding:16px 0}.settings{padding:0}.university{font-size:22px}main{margin-top:20px}h1{font-size:19px}h2{font-size:16px}.table-scroll{overflow:auto}table{min-width:570px}.header-inner,main{margin-left:16px;margin-right:16px}}
.announcement{margin-top:16px;padding:12px 14px;border:1px solid #ccc;background:#f7f7f7;line-height:1.8}.announcement p{margin:0}.announcement .published-at{margin-top:6px;font-size:calc(12px * var(--scale));color:#666}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<div class="university">芝浦工業大学</div>
<div class="settings" aria-label="表示設定">
<span class="settings-label" id="font-label">文字サイズ</span>
<button class="option" data-size="small" aria-describedby="font-label" aria-pressed="false">小</button>
<button class="option" data-size="medium" aria-describedby="font-label" aria-pressed="true">中</button>
<button class="option" data-size="large" aria-describedby="font-label" aria-pressed="false">大</button>
<span class="settings-label" id="color-label">サイトカラー</span>
<button class="option" data-color="light" aria-describedby="color-label" aria-pressed="false">薄い</button>
<button class="option" data-color="standard" aria-describedby="color-label" aria-pressed="true">標準</button>
<button class="option" data-color="dark" aria-describedby="color-label" aria-pressed="false">濃い</button>
</div></div></header>
<main>
<section id="results" aria-labelledby="page-title">
<h1 id="page-title"><span>オンライン合否照会</span></h1>
<div class="announcement" role="note" aria-label="合否発表に関するお知らせ">
<p>PHPの脆弱性への対応に伴い、合否結果のWeb公開を当初の予定より延期いたしました。<br>受験生の皆様ならびに保護者の皆様をお待たせしましたことを、深くお詫び申し上げます。</p>
<p class="published-at">合否公開日時：<time datetime="2026-11-04T00:00:00+09:00">2026年11月4日 0:00</time></p>
</div>
<h2><span>工学部総合型選抜</span></h2>
<div class="table-scroll"><table aria-label="合否照会結果">
<colgroup><col class="result"><col class="course"><col class="number"></colgroup>
<tbody><tr><td class="result-cell" rowspan="2">不合格</td><th scope="col">学部・コース</th><th scope="col">受験番号</th></tr>
<tr><td>学部　情報・通信工学課程　情報工学コース（9018）</td><td class="number-cell">901801L</td></tr></tbody>
</table></div>
<div class="review"><label class="review-label" for="review-comment">総評・コメント</label><textarea class="review-input" id="review-comment" rows="32" spellcheck="false">提出されたアプリケーションからは、課題の発見から設計、実装、改善に至るまで、自ら考えて取り組んだ過程がうかがえました。着想を実際に利用できる形にまとめており、実用性と完成度の両面で評価できる内容でした。外部からの攻撃を想定した模擬テストでも、検証した範囲では脆弱性は確認されておらず、公開・運用を見据えて安全性の検証に取り組んだ点も評価しました。

設計上の工夫としては、国内で利用されているスマートフォンの性能分布を踏まえ、幅広い端末で快適に動作するよう仕様を見直した点が挙げられます。当初のデザインやアニメーションの一部をあえて簡素化し、処理負荷の軽減と操作性を優先した判断は、利用者の環境を考慮した適切なものでした。表現の豊かさだけを追求するのではなく、利用条件に応じて必要な機能や表現を選択した点に、設計に対する理解が表れています。

特に興味深かったのは、制作したアプリケーションを実際に利用者に試してもらい、その意見を取り入れながら、短い周期で改修を重ねていた点です。利用者との対話を通じて要求を把握し、当初の想定と実際の使われ方との違いを改善につなげる姿勢は、システムエンジニアにとって重要な資質です。自身の技術や発想に固執せず、利用者の立場から成果物を見直せることを評価しました。

また、スクーリングでは、他学部の参加者にも自ら働きかけ、相手の意見を踏まえながら議論に参加する様子が見られました。制作活動とスクーリングの双方から、主体性に加え、他者と協働して課題に取り組むためのコミュニケーション能力が認められました。

現時点で、独力でアプリケーションを設計・実装し、利用者の意見をもとに改善できるプログラミング能力を備えていると評価しています。そのため、大学での学修では、プログラミングの基礎的な技能の習得に重点を置くよりも、ハードウェアの構成や動作原理、情報が伝わる仕組みなど、ソフトウェアを支える技術へ理解を広げることが、今後の成長にとって有益であると考えました。

これまでの自主的な学習と制作の実績を踏まえると、プログラミングについては、今後も独学と実践を通じて力を伸ばしていくことが期待できます。通信分野での学修と並行して開発を継続することで、プログラミングに重点を置く学生にも引けを取らず、さらに高い水準の実装力へと発展させる可能性があると考えます。すでに持つ技能を深めながら、その背景にある仕組みを学ぶという点で、通信コースでの学修が適していると判断しました。

以上の評価を踏まえ、今後の進路として通信コースを検討することを勧めます。今回の情報工学コースの選考については、同コースの選抜方針との適合性を含めて総合的に審査した結果、不合格と判定しました。

【コメント】
端末性能の違いを踏まえて描画表現や処理負荷を見直した点に、実際の利用を意識した設計上の工夫が見られました。今後、処理時間や動作状況を測定し、変更の効果を定量的に検証することで、設計判断をより明確に説明できるようになると考えます。

試用を通じて利用者の意見を集め、改修へと結び付けた点が印象に残りました。要求を聞き取り、実装し、その結果を確かめる過程を継続できることは、システム開発における強みです。スクーリングで見られた主体性や対話の姿勢も、こうした取り組みを支えていると評価します。

独学によって実用的なアプリケーションを制作した実績から、今後も自ら技術を習得していく力が期待できます。大学では、現在の実装力を生かしつつ、ハードウェアや通信の原理へ学びを広げることで、動作の仕組みまで理解して設計できる技術者へ成長することを期待します。</textarea></div>
<div class="actions"><button class="back" id="back-button">マイページに戻る</button></div>
</section>
<section id="mypage" hidden aria-labelledby="mypage-title">
<h1 id="mypage-title" tabindex="-1"><span>マイページ</span></h1>
<div class="mypage"><p>工学部総合型選抜</p><button class="back" id="show-results">オンライン合否照会</button></div>
</section>
</main>
<script>
const root=document.documentElement;
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
root.style.setProperty('--scale',({small:.875,medium:1,large:1.125})[button.dataset.size]);
document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
}));
document.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{
root.style.setProperty('--green',({light:'#407340',standard:'#0c420c',dark:'#002800'})[button.dataset.color]);
document.querySelectorAll('[data-color]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
}));
const results=document.getElementById('results'),mypage=document.getElementById('mypage');
document.getElementById('back-button').addEventListener('click',()=>{results.hidden=true;mypage.hidden=false;document.getElementById('mypage-title').focus()});
document.getElementById('show-results').addEventListener('click',()=>{mypage.hidden=true;results.hidden=false;document.getElementById('back-button').focus()});
</script>
</body>
</html>
